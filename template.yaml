AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Family Photos Backend — serverless API for uploading and retrieving photos

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 256
    Environment:
      Variables:
        PHOTOS_TABLE: !Ref PhotosTable
        PHOTOS_BUCKET: !Ref PhotosBucket

Resources:
  # ---------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------
  PhotosApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      BinaryMediaTypes:
        - "application/octet-stream"
        - "image/*"

  # ---------------------------------------------------------------
  # Lambda Functions
  # ---------------------------------------------------------------
  UploadPhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.upload_photo.handler
      CodeUri: src/
      Description: Handles photo uploads — stores image in S3 and metadata in DynamoDB
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref PhotosBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTable
      Events:
        UploadPhoto:
          Type: Api
          Properties:
            RestApiId: !Ref PhotosApi
            Path: /photos
            Method: post

  GetPhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.get_photos.handler
      CodeUri: src/
      Description: Retrieves photos with optional tag filters
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref PhotosBucket
        - DynamoDBReadPolicy:
            TableName: !Ref PhotosTable
      Events:
        GetPhotos:
          Type: Api
          Properties:
            RestApiId: !Ref PhotosApi
            Path: /photos
            Method: get

  # ---------------------------------------------------------------
  # S3 Bucket
  # ---------------------------------------------------------------
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------
  # DynamoDB Table (single-table design)
  # ---------------------------------------------------------------
  PhotosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${PhotosApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  PhotosBucketName:
    Description: S3 bucket for photo storage
    Value: !Ref PhotosBucket
  PhotosTableName:
    Description: DynamoDB table for photo metadata
    Value: !Ref PhotosTable
